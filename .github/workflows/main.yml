name: Build B4DDAX Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Java 17
      # ----------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ----------------------------------------
      # 3. Gradle 9.3.1
      # ----------------------------------------
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # ----------------------------------------
      # 4. Find ZIP
      # ----------------------------------------
      - name: Find B4DDAX Music ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ----------------------------------------
      # 5. Extract ZIP
      # ----------------------------------------
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted_project

          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted files:"
          find extracted_project -maxdepth 3 -type f | head -100


      # ----------------------------------------
      # 6. Find Gradle Android project
      # ----------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Searching for Gradle files..."

            find extracted_project \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \)

            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ----------------------------------------
      # 7. Check project
      # ----------------------------------------
      - name: Check project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "================================="
          echo "PROJECT DIRECTORY"
          echo "================================="

          pwd

          echo ""
          echo "================================="
          echo "FILES"
          echo "================================="

          ls -la

          echo ""
          echo "================================="
          echo "GRADLE FILES"
          echo "================================="

          find . -maxdepth 3 -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradle.properties" \
            \)


      # ----------------------------------------
      # 8. Create / Update Gradle Wrapper
      # ----------------------------------------
      - name: Create Gradle Wrapper 9.3.1
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found."
            echo "Creating Gradle 9.3.1 wrapper..."

            gradle wrapper --gradle-version 9.3.1
          else
            echo "gradlew found."
            echo "Updating wrapper to Gradle 9.3.1..."

            gradle wrapper --gradle-version 9.3.1
          fi


      # ----------------------------------------
      # 9. Make Gradle executable
      # ----------------------------------------
      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x ./gradlew

          ls -lh ./gradlew


      # ----------------------------------------
      # 10. Verify Gradle
      # ----------------------------------------
      - name: Verify Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --version


      # ----------------------------------------
      # 11. Create Debug Keystore
      # ----------------------------------------
      - name: Create Debug Keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "debug.keystore" ]; then

            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "debug.keystore already exists."

          fi

          echo ""
          echo "Debug keystore:"
          ls -lh debug.keystore


      # ----------------------------------------
      # 12. Clean
      # ----------------------------------------
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew clean --stacktrace


      # ----------------------------------------
      # 13. Build Debug APK
      # ----------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace


      # ----------------------------------------
      # 14. Find APK
      # ----------------------------------------
      - name: Locate APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "================================="
          echo "APK FILES"
          echo "================================="

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ----------------------------------------
      # 15. Upload APK
      # ----------------------------------------
      - name: Upload B4DDAX Music APK
        uses: actions/upload-artifact@v4
        with:
          name: B4DDAX-Music-debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ----------------------------------------
      # 16. Build summary
      # ----------------------------------------
      - name: Build Summary
        if: success()
        run: |
          echo "================================="
          echo "B4DDAX MUSIC APK BUILD SUCCESS"
          echo "================================="
          echo ""
          echo "APK artifact:"
          echo "B4DDAX-Music-debug-APK"
          echo ""
          echo "Go to:"
          echo "Actions -> Build APK -> Artifacts"
